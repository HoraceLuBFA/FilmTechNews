<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>运行日志 · 影视技术日报</title>
<style>
:root{color-scheme:light dark;--bg:#13191c;--panel:#1c2529;--fg:#e8edeb;--muted:#98a4a8;--line:#334045;--accent:#12c5d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 16px}a{color:var(--accent);text-decoration:none}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}section{margin-top:20px}.number{font-size:30px;font-weight:650;color:var(--accent);margin-top:6px}.ok{color:var(--accent)}.warn{color:#f0b06c}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row:first-child{border-top:0}.record{padding:14px 0;border-top:1px solid var(--line)}.record:first-child{border-top:0}.record p{margin:5px 0}p{margin:10px 0}.heading{display:flex;align-items:center;gap:10px}.heading svg{width:24px;height:24px;color:var(--accent);flex:none}@media(max-width:650px){main{padding:22px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}.number{font-size:26px}.row{gap:5px}header{margin-bottom:20px}}
</style></head><body><main><header><div><div class="heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><h1>影视技术日报 · 运行日志</h1></div><div class="muted">云端独立监工 · 仅管理员可见</div></div><a href="/">返回网站</a></header>
<p id="status">正在读取云端运行状态……</p><p class="muted" id="time"></p>
<div class="grid" id="metrics"></div><section><h2>服务与更新</h2><div id="services"></div></section>
<section><h2>需要关注</h2><div id="issues"></div></section><section><h2>小时检查与三小时汇总</h2><div id="history"></div></section>
<p class="muted">运行状态每 5 分钟采样，页面每 60 秒刷新；每小时 05 分检查，每 3 小时 10 分汇总。无合格新稿或正常小时限额等待不等于故障。监工不调用模型。</p></main>
<script>
const $=id=>document.getElementById(id);const text=(tag,value,cls)=>{const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;return n};
const at=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'暂无记录';
function row(parent,label,value){const n=text('div','', 'row');n.append(text('span',label,'muted'),text('span',value));parent.append(n)}
async function load(){try{const response=await fetch('./status.json',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json(),s=data.latest,u=s.usage||{};const stale=Date.now()-Date.parse(s.at)>15*60000;
$('status').textContent=stale?'监工状态超过十五分钟未刷新，请检查云端定时任务':s.status==='ok'?'运行正常':'存在需要关注的运行异常';$('status').className=stale||s.status!=='ok'?'warn':'ok';$('time').textContent='最近采样：'+at(s.at)+'（北京时间）';
$('metrics').replaceChildren();for(const [label,value] of [['公开文章',s.public_total],['待处理材料',s.waiting],['本小时完成分析',s.analyzed_hour],['日常剩余调用',s.daily_limit===undefined?null:Math.max(0,s.daily_limit-u.day)]]){const c=text('div','','card');c.append(text('div',label,'muted'),text('div',value==null?'—':String(value),'number'));$('metrics').append(c)}
$('services').replaceChildren();for(const [name,ok] of Object.entries(s.services))row($('services'),name,ok?'运行中':'不可用');row($('services'),'公网与内部 API',s.http_ok?'可访问':'检查失败');row($('services'),'调用节奏',(u.hour??'—')+'/40 本小时；'+(u.day??'—')+'/'+(s.daily_limit??'—')+' 滚动24小时');row($('services'),'启用信源',s.sources??'—');for(const r of s.reports||[])row($('services'),({daily:'日报',weekly:'周报',monthly:'月报'})[r.kind],r.key+' · '+r.items+'项 · '+at(r.generated_at));row($('services'),'邮件告警',data.mail.last_ok===false?'最近发送失败':data.mail.last_ok===true?'最近告警已获邮件服务器接受':'已配置，尚无异常告警');
$('issues').replaceChildren();for(const issue of s.problems||[])$('issues').append(text('p',issue,'warn'));if(!s.problems?.length)$('issues').append(text('p','当前未检测到运行异常。','muted'));
$('history').replaceChildren();for(const h of [...data.history].reverse().slice(0,60)){const n=text('div','','record');n.append(text('div',at(h.at)+' · '+(h.mode==='summary'?'三小时汇总':'小时检查')));const d=h.delta||{};n.append(text('p','待处理 '+(h.waiting??'—')+' 篇；自上次同类记录新增材料 '+(d.raw_total??'—')+' 篇，完成分析 '+(d.analysis_total??'—')+' 篇，公开池净变化 '+(d.public_total??'—')+' 篇。','muted'));if(h.problems?.length)n.append(text('p',h.problems.join('；'),'warn'));$('history').append(n)}if(!data.history.length)$('history').append(text('p','等待第一条定时检查记录。','muted'));
}catch(_){$('status').textContent='运行状态读取失败，请刷新或检查登录状态';$('status').className='warn'}}load();setInterval(load,60000);
</script></body></html>
