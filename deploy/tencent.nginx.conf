server {
    listen 80;
    server_name filmtech.lumenghe.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name filmtech.lumenghe.com;
    ssl_certificate /usr/local/lighthouse/softwares/srs-cloud/mgmt/containers/ssl/nginx.crt;
    ssl_certificate_key /usr/local/lighthouse/softwares/srs-cloud/mgmt/containers/ssl/nginx.key;
    access_log off;
    client_max_body_size 5m;
    location = /log { return 301 /log/; }
    # Replace the token placeholder with a server-generated value also supplied to the API.
    # Never commit the rendered configuration or the password file.
    location ^~ /log/api/ {
        auth_basic "FilmTechNews private log";
        auth_basic_user_file /usr/local/nginx/conf/.filmtech-log.htpasswd;
        proxy_pass http://127.0.0.1:3310/api/private-log/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FilmTech-Log-Token "__PRIVATE_LOG_API_TOKEN__";
        proxy_set_header X-FilmTech-Log-User $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        limit_except GET PATCH { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /log/ {
        auth_basic "FilmTechNews private log";
        auth_basic_user_file /usr/local/nginx/conf/.filmtech-log.htpasswd;
        alias /var/lib/filmtech-watchdog-public/;
        index index.html;
        autoindex off;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
