server {
    listen 80;
    server_name filmtech.lumenghe.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name filmtech.lumenghe.com;
    ssl_certificate /usr/local/lighthouse/softwares/srs-cloud/mgmt/containers/ssl/nginx.crt;
    ssl_certificate_key /usr/local/lighthouse/softwares/srs-cloud/mgmt/containers/ssl/nginx.key;
    access_log off;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
