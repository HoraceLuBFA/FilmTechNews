# Use the existing Nginx on Tencent. The site listener is local to this host.
services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:55441:5432"
  api:
    environment:
      LLM_BASE_URL: http://172.17.0.1:3320/v1
      LLM_HOURLY_CALL_LIMIT: "12"
      LLM_REPORT_HOURLY_RESERVE: "2"
      LLM_MAX_CONCURRENT_CALLS: "4"
      LLM_REPORT_CONCURRENT_RESERVE: "1"
  worker:
    stop_grace_period: 390s
    # The host's existing egress proxy only listens on loopback. This worker has
    # no HTTP listener; host networking avoids exposing or reconfiguring the proxy.
    network_mode: host
    environment:
      DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@127.0.0.1:55441/aihot
      API_BASE_URL: http://127.0.0.1:3310
      LOCAL_ROUTER_URL: http://127.0.0.1:3310
      EGRESS_PROXY_URL: http://127.0.0.1:7890
      LLM_BASE_URL: http://172.17.0.1:3320/v1
      LLM_MODEL: gpt-5.6-sol
      LLM_TIMEOUT_MS: "330000"
      LLM_HOURLY_CALL_LIMIT: "12"
      LLM_REPORT_HOURLY_RESERVE: "2"
      LLM_MAX_CONCURRENT_CALLS: "4"
      LLM_REPORT_CONCURRENT_RESERVE: "1"
      LLM_EXTRA_JSON: '{"reasoning_effort":"medium"}'
      MODEL_CALLS_ENABLED: "true"
      COLLECT_ENABLED: "true"
      ANALYZE_CONCURRENCY: "1"
    cpus: 0.75
    mem_limit: 768m
